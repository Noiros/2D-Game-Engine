name: Build Runtime (Windows via MinGW)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (MinGW, CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build pkg-config

      - name: Configure (CMake - Ninja - MinGW)
        run: |
          cmake -S . -B build-runtime \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EDITOR=OFF

      - name: Build Runtime
        run: cmake --build build-runtime --config Release --target Runtime -j 2

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # Copy any produced .exe files to artifacts
          find build-runtime -name "Runtime.exe" -exec cp {} artifacts/ \; || true
          find build-runtime -name "*.dll" -exec cp {} artifacts/ \; || true
          # Also look into bin folder produced by CMake if exists
          if [ -d "bin" ]; then cp -r bin artifacts/bin || true; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Runtime-windows-mingw
          path: artifacts
