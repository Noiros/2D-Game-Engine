name: Build Editor (Windows via MinGW)

on:
  workflow_call:

jobs:
  build-editor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (MinGW, CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build pkg-config

      - name: Configure (CMake - Ninja - MinGW)
        run: |
          cmake -S . -B build-editor \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EDITOR=ON

      - name: Build Editor
        run: cmake --build build-editor --config Release --target Editor -j 2

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # Copy any produced .exe files to artifacts
          find build-editor -name "Editor.exe" -exec cp {} artifacts/ \; || true
          find build-editor -name "*.dll" -exec cp {} artifacts/ \; || true
          # Also look into bin folder produced by CMake if exists
          if [ -d "bin" ]; then cp -r bin artifacts/bin || true; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Editor-windows-mingw
          path: artifacts
